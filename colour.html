<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yummy Mandarin Fruits</title>
    <style>
        body {
            font-family: 'Arial Round', sans-serif;
            background-color: #e8f5e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            background: white;
            padding: 30px;
            border-radius: 40px;
            box-shadow: 0 20px 0 #81c784;
            width: 900px;
            height: 500px;
            position: relative;
        }

        /* Bagian Monster (Kiri) */
        .monster-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #bubble {
            background: white;
            border: 3px solid #333;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 40px;
            text-align: center;
        }

        /* Bagian Buah (Kanan) */
        .fruit-shelf {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            background: #fff9c4;
            border-radius: 20px;
            border: 4px solid #fbc02d;
        }

        .fruit-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .fruit-item:hover { transform: scale(1.1); }

        .fruit-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            position: relative;
            box-shadow: inset -5px -5px rgba(0,0,0,0.2);
        }

        .leaf {
            width: 15px;
            height: 10px;
            background: #4caf50;
            border-radius: 100% 0;
            position: absolute;
            top: -5px;
            left: 25px;
        }

        /* Animasi Buah Melompat */
        .flying-fruit {
            position: absolute;
            z-index: 100;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(3px, 2px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(-1deg); }
            80% { transform: translate(3px, -2px) rotate(1deg); }
            100% { transform: translate(1px, -1px) rotate(0deg); }
        }

        .shaking { animation: shake 0.2s infinite; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="monster-box" id="monsterBox">
            <div id="bubble">Loading...</div>
            <canvas id="monsterCanvas" width="350" height="350"></canvas>
        </div>

        <div class="fruit-shelf" id="fruitShelf">
            </div>
    </div>

    <script>
        const canvas = document.getElementById("monsterCanvas");
        const ctx = canvas.getContext("2d");
        const bubble = document.getElementById("bubble");
        const shelf = document.getElementById("fruitShelf");
        const monsterBox = document.getElementById("monsterBox");

        const colorList = [
            { hanzi: "红色", pinyin: "hóng sè", hex: "#ff4444", name: "Red" },
            { hanzi: "黄色", pinyin: "huáng sè", hex: "#ffeb3b", name: "Yellow" },
            { hanzi: "蓝色", pinyin: "lán sè", hex: "#2196f3", name: "Blue" },
            { hanzi: "绿色", pinyin: "lǜ sè", hex: "#4caf50", name: "Green" },
            { hanzi: "白色", pinyin: "bái sè", hex: "#ffffff", name: "White" },
            { hanzi: "黑色", pinyin: "hēi sè", hex: "#212121", name: "Black" },
            { hanzi: "橙色", pinyin: "chéng sè", hex: "#ff9800", name: "Orange" },
            { hanzi: "紫色", pinyin: "zǐ sè", hex: "#9c27b0", name: "Purple" }
        ];

        let monsterColor = "#cfd8dc";
        let target = null;
        let expression = "neutral"; 
        let feedbackText = "";

        function init() {
            shelf.innerHTML = ""; 

            colorList.forEach(c => {
                const item = document.createElement("div");
                item.className = "fruit-item";
                
                item.innerHTML = `
                    <div class="fruit-circle" style="background: ${c.hex}; ${c.hex==='#ffffff'?'border:1px solid #ccc':''}">
                        <div class="leaf"></div>
                    </div>
                `;
                item.onclick = (e) => animateFruit(e, c);
                shelf.appendChild(item);
            });
            nextTarget();
            draw();
        }

        function nextTarget() {
            target = colorList[Math.floor(Math.random() * colorList.length)];
            // 🌟 WARNA TEKS DIKUNCI KE HITAM (#333) AGAR SISWA BENAR-BENAR MEMBACA HURUF MANDARIN/PINYIN
            bubble.innerHTML = `Give me <br> <span style="color:#333333">${target.hanzi} (${target.pinyin})</span>`;
            expression = "neutral";
            feedbackText = "";
        }

        function animateFruit(e, colorObj) {
            const rect = e.currentTarget.querySelector('.fruit-circle').getBoundingClientRect();
            const fly = document.createElement("div");
            fly.className = "fruit-circle flying-fruit";
            fly.style.background = colorObj.hex;
            if(colorObj.hex === '#ffffff') fly.style.border = '1px solid #ccc';
            fly.style.left = rect.left + "px";
            fly.style.top = rect.top + "px";
            document.body.appendChild(fly);

            const mRect = canvas.getBoundingClientRect();
            const targetX = mRect.left + 150;
            const targetY = mRect.top + 200;

            setTimeout(() => {
                fly.style.left = targetX + "px";
                fly.style.top = targetY + "px";
                fly.style.transform = "scale(0.5)";
                fly.style.opacity = "0";
            }, 10);

            setTimeout(() => {
                fly.remove();
                checkFeed(colorObj);
            }, 600);
        }

        function checkFeed(colorObj) {
            if (colorObj.hex === target.hex) {
                monsterColor = colorObj.hex;
                expression = "happy";
                feedbackText = "好吃! hǎo chī!";
                bubble.innerHTML = `<span style="color:green">${feedbackText}</span>`;
                setTimeout(nextTarget, 2000);
            } else {
                expression = "angry";
                monsterBox.classList.add("shaking");
                feedbackText = "Hey! 😡";
                bubble.innerHTML = `<span style="color:red">${feedbackText}</span>`;
                setTimeout(() => {
                    monsterBox.classList.remove("shaking");
                    expression = "neutral";
                    // Kembali ke warna hitam netral saat reset pertanyaan yang salah
                    bubble.innerHTML = `Give me <br> <span style="color:#333333">${target.hanzi} (${target.pinyin})</span>`;
                }, 1000);
            }
        }

        function drawMonster() {
            const x = 175, y = 200;
            const bodyColor = expression === "angry" ? "#ff5252" : monsterColor;

            // Badan
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.moveTo(x-80, y+100);
            ctx.quadraticCurveTo(x, y-150, x+80, y+100);
            ctx.fill();
            ctx.strokeStyle = "#333"; ctx.lineWidth = 5; ctx.stroke();

            // Mata
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(x - 35, y - 20, 25, 0, Math.PI * 2);
            ctx.arc(x + 35, y - 20, 25, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            // Pupil
            ctx.fillStyle = "black";
            if (expression === "happy") {
                ctx.font = "bold 30px Arial";
                ctx.fillText("^", x-45, y-10); ctx.fillText("^", x+25, y-10);
            } else if (expression === "angry") {
                ctx.beginPath();
                ctx.moveTo(x-55, y-40); ctx.lineTo(x-15, y-20);
                ctx.moveTo(x+55, y-40); ctx.lineTo(x+15, y-20);
                ctx.stroke();
                ctx.beginPath(); ctx.arc(x-35, y-15, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+35, y-15, 5, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.beginPath(); ctx.arc(x-35, y-20, 10, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+35, y-20, 10, 0, Math.PI*2); ctx.fill();
            }

            // Mulut
            ctx.beginPath();
            if (expression === "happy") {
                ctx.arc(x, y + 30, 30, 0, Math.PI);
                ctx.fillStyle = "#880e4f"; ctx.fill();
            } else if (expression === "angry") {
                ctx.moveTo(x-30, y+50); ctx.lineTo(x+30, y+40);
            } else {
                ctx.arc(x, y + 40, 20, 0, Math.PI, true);
            }
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMonster();
            requestAnimationFrame(draw);
        }

        init();
    </script>
</body>
</html>
