<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart School Bag - Final Fixed</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            background-color: #f8fbff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            background: white;
            padding: 30px;
            border-radius: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.1);
            width: 980px;
            height: 580px;
            border: 10px solid #4a90e2;
        }

        .bag-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #speech-bubble {
            background: #fff;
            border: 4px solid #333;
            border-radius: 20px;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            width: 300px;
            position: relative;
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            border-width: 20px 15px 0;
            border-style: solid;
            border-color: #333 transparent;
            margin-left: -15px;
        }

        .shelf {
            flex: 1.2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            background: #fff3e0;
            border-radius: 30px;
            border: 4px solid #ffb74d;
            overflow-y: auto;
        }

        .item-card {
            background: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Memastikan gambar/emoji pas di tengah kartu */
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #ddd;
            border-bottom: 6px solid #ccc;
        }

        .item-card:hover { transform: translateY(-5px); border-color: #4a90e2; }

        /* --- VISUALS --- */
        .visual-container {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eraser-box {
            width: 60px; height: 35px; border: 2px solid #333; border-radius: 4px; display: flex;
        }
        .e-pink { background: #ff80ab; flex: 1.5; border-right: 2px solid #333; }
        .e-blue { background: #4fc3f7; flex: 1; }

        .textbook-open {
            width: 90px; height: 60px; display: flex; position: relative;
            border: 2px solid #2e7d32; border-radius: 4px; background: #66bb6a; padding: 2px;
        }
        .tb-page { flex: 1; background: white; border: 1px solid #ddd; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .tb-left { border-radius: 3px 0 0 3px; border-right: 2px solid #2e7d32; }
        .tb-right { border-radius: 0 3px 3px 0; }

        .notebook-open {
            width: 85px; height: 65px; display: flex; background: #333; padding-left: 8px; border-radius: 4px; position: relative;
        }
        .nb-page { 
            flex: 1; background: white; margin: 2px; border-radius: 2px;
            background-image: linear-gradient(#e1f5fe 1px, transparent 1px);
            background-size: 100% 6px; position: relative;
        }
        .nb-margin { position: absolute; left: 6px; top: 0; bottom: 0; width: 1px; background: #ff5252; }
        .spiral { 
            position: absolute; left: 2px; top: 5px; bottom: 5px; width: 4px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .ring { width: 6px; height: 4px; background: #fff; border: 1px solid #000; border-radius: 2px; }

        .flyer { position: absolute; z-index: 999; pointer-events: none; transition: all 0.7s ease-in; }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        .shaking { animation: shake 0.1s infinite; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="bag-section" id="bagBox">
            <div id="speech-bubble">Loading...</div>
            <canvas id="bagCanvas" width="400" height="400"></canvas>
        </div>
        <div class="shelf" id="shelf"></div>
    </div>

    <script>
        const canvas = document.getElementById("bagCanvas");
        const ctx = canvas.getContext("2d");
        const bubble = document.getElementById("speech-bubble");
        const shelf = document.getElementById("shelf");
        const bagBox = document.getElementById("bagBox");

        const stationery = [
            { hanzi: "铅笔", pinyin: "qiān bǐ", type: "emoji", val: "✏️" },
            { hanzi: "铅笔盒", pinyin: "qiān bǐ hé", type: "emoji", val: "👝" },
            { hanzi: "尺子", pinyin: "chǐ zi", type: "emoji", val: "📏" },
            { hanzi: "书", pinyin: "shū", type: "textbook" },
            { hanzi: "本子", pinyin: "běn zi", type: "notebook" },
            { hanzi: "书包", pinyin: "shū bāo", type: "emoji", val: "🎒" },
            { hanzi: "橡皮", pinyin: "xiàng pí", type: "eraser" }
        ];

        let target = null;
        let mood = "neutral";

        function init() {
            gameContainer = document.getElementById("shelf");
            gameContainer.innerHTML = ""; // Reset shelf sebelum render

            stationery.forEach(item => {
                const card = document.createElement("div");
                card.className = "item-card";
                
                let visualHtml = "";
                if(item.type === "emoji") visualHtml = `<span style="font-size:50px;">${item.val}</span>`;
                else if(item.type === "eraser") visualHtml = `<div class="eraser-box"><div class="e-pink"></div><div class="e-blue"></div></div>`;
                else if(item.type === "textbook") visualHtml = `<div class="textbook-open"><div class="tb-page tb-left">🖼️</div><div class="tb-page tb-right">🏰</div></div>`;
                else if(item.type === "notebook") visualHtml = `<div class="notebook-open"><div class="spiral">${'<div class="ring"></div>'.repeat(5)}</div><div class="nb-page"><div class="nb-margin"></div></div></div>`;

                // Pinyin telah dihapus dari baris innerHTML di bawah ini agar hanya menampilkan gambarnya saja
                card.innerHTML = `<div class="visual-container">${visualHtml}</div>`;
                card.onclick = (e) => fly(e, item);
                shelf.appendChild(card);
            });
            newTask();
            render();
        }

        function newTask() {
            target = stationery[Math.floor(Math.random() * stationery.length)];
            bubble.innerHTML = `Can you find the<br><b style="color:#1e88e5; font-size:28px;">${target.hanzi}</b>?<br>(${target.pinyin})`;
            mood = "neutral";
        }

        function fly(e, item) {
            const visualSource = e.currentTarget.querySelector('.visual-container');
            const rect = visualSource.getBoundingClientRect();
            
            const flyer = document.createElement("div");
            flyer.className = "flyer";
            flyer.innerHTML = visualSource.innerHTML; 
            flyer.style.left = rect.left + "px";
            flyer.style.top = rect.top + "px";
            flyer.style.width = rect.width + "px";
            flyer.style.height = rect.height + "px";
            flyer.style.display = "flex";
            flyer.style.alignItems = "center";
            flyer.style.justifyContent = "center";
            
            document.body.appendChild(flyer);

            const bRect = canvas.getBoundingClientRect();
            setTimeout(() => {
                flyer.style.left = (bRect.left + 150) + "px";
                flyer.style.top = (bRect.top + 150) + "px";
                flyer.style.transform = "scale(0.1) rotate(360deg)";
                flyer.style.opacity = "0";
            }, 50);

            setTimeout(() => {
                flyer.remove();
                check(item);
            }, 700);
        }

        function check(item) {
            if (item.hanzi === target.hanzi) {
                mood = "happy";
                bubble.innerHTML = "<span style='color:green; font-size:32px;'>Correct! 🌟</span>";
                setTimeout(newTask, 1500);
            } else {
                mood = "angry";
                bagBox.classList.add("shaking");
                bubble.innerHTML = "<span style='color:red; font-size:26px;'>Not that one! 😡</span>";
                setTimeout(() => {
                    bagBox.classList.remove("shaking");
                    mood = "neutral";
                    bubble.innerHTML = `Can you find the<br><b style="color:#1e88e5; font-size:28px;">${target.hanzi}</b>?<br>(${target.pinyin})`;
                }, 1200);
            }
        }

        function drawBag() {
            const x = 200, y = 220;
            const color = (mood === "angry") ? "#f44336" : "#4a90e2";
            ctx.strokeStyle = "#333"; ctx.lineWidth = 10;
            ctx.strokeRect(x-40, y-110, 80, 45);
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.roundRect(x-110, y-80, 220, 240, 40); ctx.fill();
            ctx.strokeStyle = "#333"; ctx.lineWidth = 6; ctx.stroke();
            ctx.fillStyle = "#fff176";
            ctx.beginPath(); ctx.roundRect(x-75, y+50, 150, 85, 15); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(x-45, y, 25, 0, Math.PI*2); ctx.arc(x+45, y, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "black";
            if(mood === "happy") {
                ctx.lineWidth = 5;
                ctx.beginPath(); ctx.arc(x-45, y+5, 12, Math.PI, 0); ctx.stroke();
                ctx.beginPath(); ctx.arc(x+45, y+5, 12, Math.PI, 0); ctx.stroke();
            } else if(mood === "angry") {
                ctx.font = "bold 30px Arial";
                ctx.fillText(">", x-60, y+10); ctx.fillText("<", x+30, y+10);
            } else {
                ctx.beginPath(); ctx.arc(x-45, y, 9, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+45, y, 9, 0, Math.PI*2); ctx.fill();
            }
            ctx.beginPath();
            if(mood === "happy") ctx.arc(x, y+35, 25, 0, Math.PI);
            else if(mood === "angry") ctx.arc(x, y+60, 15, 1.1*Math.PI, 1.9*Math.PI);
            else { ctx.moveTo(x-20, y+50); ctx.lineTo(x+20, y+50); }
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBag();
            requestAnimationFrame(render);
        }

        init();
    </script>
</body>
</html>
